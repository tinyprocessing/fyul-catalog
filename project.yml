name: Catalog
options:
  bundleIdPrefix: com.tinyprocessing
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  CatalogKit:
    path: Packages/CatalogKit
targets:
  Catalog:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CatalogKit
        product: DesignSystem
      - package: CatalogKit
        product: CatalogCore
      - package: CatalogKit
        product: ProductsFeature
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Catalog
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        APIBaseURL: $(API_BASE_URL)
        RemoteConfigURL: $(REMOTE_CONFIG_URL)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Catalog
  CatalogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CatalogTests
    dependencies:
      - package: CatalogKit
        product: CatalogCore
      - package: CatalogKit
        product: ProductsFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyprocessing.catalog.tests
        GENERATE_INFOPLIST_FILE: YES
  CatalogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CatalogUITests
    dependencies:
      - target: Catalog
      - package: CatalogKit
        product: CatalogAccessibility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinyprocessing.catalog.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Catalog
schemes:
  Catalog:
    build:
      targets:
        Catalog: all
        CatalogTests: [test]
        CatalogUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Catalog
      targets:
        - CatalogTests
        - CatalogUITests
    archive:
      config: Release
